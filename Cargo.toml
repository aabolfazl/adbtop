[package]
name = "adbtop"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
description = "Live performance for Android apps over adb: a terminal UI, plus JSON and CSV recording for scripts, CI and AI agents"
authors = ["Abolfazl Abbasi"]
license = "MIT"
repository = "https://github.com/aabolfazl/adbtop"
homepage = "https://github.com/aabolfazl/adbtop"
readme = "README.md"
keywords = ["android", "adb", "performance", "profiling", "tui"]
categories = ["command-line-utilities", "development-tools::profiling"]
include = [
    "/src/**",
    "/build.rs",
    "/proto/**",
    "/agent/adbtop-agent.apk",
    "/skills/adbtop/SKILL.md",
    "/README.md",
    "/LICENSE",
]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
