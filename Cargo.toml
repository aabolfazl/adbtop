[package]
name = "android-perf-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Android performance monitoring TUI (btop-style)"
authors = ["Abolfazl Abbasi"]
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prost = "0.14"

[build-dependencies]
prost-build = "0.14"
# Compiles proto/agent.proto in Rust, so building doesn't need protoc installed.
protox = "0.9"

[profile.release]
opt-level = 3
lto = true
